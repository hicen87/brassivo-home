<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10131c">
<meta name="description" content="方块飞车：方块风格卡丁车网页游戏，漂移、道具、AI对手，手机平板电脑都能玩。">
<title>方块飞车 · Block Kart | Brassivo</title>
<link rel="canonical" href="https://brassivo.com/block-kart/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+KuaiLe&display=swap">
<style>
:root{
  --ink:#10131c; --panel:rgba(22,27,40,.9); --panel-solid:#161b28; --line:#0b0d14;
  --gold:#ffc93c; --gold-d:#b9851a; --red:#ff5a3c; --green:#4cc35c; --sky:#9bd6ff; --txt:#f3f5fa; --mut:#a9b2c6;
  --disp:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --pix:'Silkscreen','ZCOOL KuaiLe',ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#10131c;color:var(--txt);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:14px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:6px}
/* ---------- menu ---------- */
#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(440px,calc(100% - 32px));overflow-y:auto;padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
#menu h1{font-family:var(--disp);font-weight:400;font-size:44px;line-height:1;margin:0;letter-spacing:2px;color:var(--gold);text-shadow:3px 3px 0 #7a4a08,6px 6px 0 var(--line)}
#menu .tag{margin:6px 0 0;color:var(--mut)}
#menu h2{font-family:var(--disp);font-weight:400;font-size:17px;margin:0 0 8px;color:var(--txt);letter-spacing:1px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{background:#232a3c;border:3px solid var(--line);border-radius:4px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 var(--line)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:#2f3750}
.opt canvas,.opt img{width:100%;max-width:100%;image-rendering:pixelated;border-radius:2px}
.opt span{font-family:var(--disp);font-size:14px}
.opt small{color:var(--mut);font-size:11px}
.chars{grid-template-columns:repeat(6,1fr)}
.chars .opt{padding:4px}
.chars img{width:40px}
#charStats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;margin-top:10px;font-size:12px;color:var(--mut)}
.bar{height:8px;background:#2a3146;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;white-space:nowrap;background:#232a3c;border:3px solid var(--line);border-radius:4px;padding:6px 4px;font-size:13px;box-shadow:0 3px 0 var(--line)}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:#2f3750;color:var(--gold)}
.big{font-family:var(--disp);font-size:24px;letter-spacing:4px;background:var(--gold);color:#3a2604;border:3px solid var(--line);border-radius:6px;padding:12px;box-shadow:0 6px 0 var(--gold-d),0 6px 0 3px var(--line)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d),0 2px 0 3px var(--line)}
.alt{font-family:var(--disp);font-size:18px;background:#2f3750;border:3px solid var(--line);border-radius:6px;padding:10px;box-shadow:0 4px 0 var(--line)}
.keys{font-size:12px;color:var(--mut);line-height:1.7;margin:0}
.keys b{color:var(--txt);font-weight:600}
.best{font-size:12px;color:var(--mut);margin:0}
.best b{font-family:var(--pix);color:var(--gold);font-weight:400}
/* ---------- hud ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--pix)}
.hud-tl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);display:flex;flex-direction:column;gap:6px}
.chip{background:var(--panel);border:3px solid var(--line);border-radius:4px;padding:4px 10px;font-size:16px;box-shadow:0 3px 0 var(--line)}
.chip b{color:var(--gold);font-weight:400;font-size:22px}
#mini{width:128px;height:128px;background:rgba(16,19,28,.55);border:3px solid var(--line);border-radius:4px}
.hud-tc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%)}
.slot{width:64px;height:64px;background:var(--panel);border:3px solid var(--line);border-radius:6px;box-shadow:0 4px 0 var(--line);display:grid;place-items:center;pointer-events:auto}
.slot img{width:48px;height:48px;image-rendering:pixelated}
.slot.rolling{border-color:var(--gold)}
.hud-tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;align-items:flex-start;gap:8px}
.pos{font-family:var(--disp);font-size:56px;line-height:.9;color:var(--gold);text-shadow:3px 3px 0 #7a4a08,5px 5px 0 var(--line)}
.pos small{font-family:var(--pix);font-size:18px;color:var(--txt);text-shadow:2px 2px 0 var(--line)}
.icon-btn{pointer-events:auto;width:44px;height:44px;background:var(--panel);border:3px solid var(--line);border-radius:6px;font-family:var(--pix);font-size:16px;box-shadow:0 3px 0 var(--line)}
.center{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:var(--disp);font-size:clamp(40px,11vw,110px);color:#fff;text-shadow:4px 4px 0 var(--line);transition:transform .15s}
.center.warn{color:var(--red);font-size:clamp(28px,6vw,54px)}
.center.small{font-size:clamp(28px,6vw,56px);color:var(--gold)}
.speedo{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);font-size:30px;text-shadow:2px 2px 0 var(--line)}
.speedo small{font-size:12px;margin-left:4px;color:var(--mut)}
/* ---------- touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none}
#joyZone{position:absolute;left:0;bottom:0;width:48%;height:62%;pointer-events:auto}
#joyBase{position:absolute;left:calc(env(safe-area-inset-left,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:130px;height:130px;border-radius:50%;background:rgba(16,19,28,.35);border:3px solid rgba(255,255,255,.35)}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid var(--line)}
.tbtns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:210px;height:190px;pointer-events:none}
.tbtns button{position:absolute;pointer-events:auto;border:3px solid var(--line);border-radius:50%;font-family:var(--disp);box-shadow:0 4px 0 var(--line);touch-action:none}
#tDrift{right:0;bottom:0;width:96px;height:96px;background:var(--gold);color:#3a2604;font-size:20px}
#tItem{right:104px;bottom:40px;width:74px;height:74px;background:#5aa9ff;color:#0a1d38;font-size:16px}
#tBrake{right:18px;bottom:108px;width:64px;height:64px;background:#e6e9f0;color:#222;font-size:14px}
.tbtns button.on{transform:translateY(3px);filter:brightness(1.15)}
/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,12,18,.45);padding:16px;box-sizing:border-box}
.dialog{width:min(420px,100%);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;box-sizing:border-box}
.dialog h2{font-family:var(--disp);font-weight:400;font-size:32px;margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--line)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:6px 4px;border-bottom:2px solid #262d40}
td:first-child{font-family:var(--disp);font-size:20px;color:var(--gold);width:36px}
td:last-child{text-align:right;font-family:var(--pix)}
tr.me td{background:rgba(255,201,60,.14)}
.face{width:22px;height:22px;image-rendering:pixelated;vertical-align:middle;margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:8px 14px;font-size:13px;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
@media (max-width:760px){
  #menu{width:calc(100% - 32px);padding:16px}
  #menu h1{font-size:36px}
  .pos{font-size:44px}
  #mini{width:96px;height:96px}
  .speedo{display:none}
}
@media (max-height:500px){
  #menu{gap:10px}
  #menu h1{font-size:30px}
  #mini{width:84px;height:84px}
  .center{top:22%}
}
@media (prefers-reduced-motion:reduce){.center{transition:none}}
</style>

</head>
<body>
<div id="stage"></div>

<div id="menu" class="panel">
  <div>
    <a href="/" style="color:var(--mut);text-decoration:none;font-size:12px">← Brassivo 首页</a>
<h1>方块飞车</h1>
    <p class="tag">6 台方块卡丁车 · 漂移攒火花 · 道具乱斗 · 3 圈定胜负</p>
  </div>
  <section><h2>赛道</h2><div id="trackList" class="opts"></div></section>
  <section><h2>车手</h2><div id="charList" class="opts chars"></div><div id="charStats"></div></section>
  <section class="row2">
    <div><h2>难度</h2><div id="diffList" class="seg"></div></div>
    <div><h2>画质</h2><div id="qList" class="seg"></div></div>
  </section>
  <p class="best" id="bestTxt"></p>
  <button id="startBtn" class="big">开始比赛</button>
  <p class="keys"><b>电脑</b>：W/↑ 油门 · S/↓ 刹车/倒车 · A D/← → 转向 · 空格 漂移 · E 道具 · P 暂停<br>
  <b>手机/平板</b>：左侧拖动转向（自动油门）· 右侧 漂移 / 道具 / 刹车<br>
  <b>手柄</b>：左摇杆转向 · RT 油门 · LT 刹车 · RB 漂移 · X 道具<br>
  漂移时间越长火花越亮：蓝 → 橙 → 紫，松开即加速。倒数到"1"时踩油门可起步冲刺。</p>
</div>

<div id="hud" hidden>
  <div class="hud-tl">
    <div class="chip">圈 <b id="lapTxt">1/3</b></div>
    <div class="chip" id="timeTxt">0:00.00</div>
    <canvas id="mini" width="160" height="160"></canvas>
  </div>
  <div class="hud-tc"><div id="itemSlot" class="slot"><img id="itemImg" alt="" hidden></div></div>
  <div class="hud-tr"><div class="pos" id="posTxt">6<small>/6</small></div><button id="pauseBtn" class="icon-btn" aria-label="暂停">II</button></div>
  <div id="center" class="center"></div>
  <div class="speedo"><span id="spdTxt">0</span><small>KM/H</small></div>
</div>

<div id="touch" hidden>
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div class="tbtns"><button id="tBrake">刹车</button><button id="tItem">道具</button><button id="tDrift">漂移</button></div>
</div>

<div id="pauseOv" class="overlay" hidden>
  <div class="dialog panel">
    <h2>暂停</h2>
    <button id="resumeBtn" class="big">继续</button>
    <button id="restartBtn" class="alt">重新开始</button>
    <button id="quitBtn" class="alt">返回菜单</button>
    <button id="muteBtn" class="alt">声音：开</button>
  </div>
</div>

<div id="resultOv" class="overlay" hidden>
  <div class="dialog panel">
    <h2 id="resTitle">比赛结束</h2>
    <p class="best" id="resBest"></p>
    <table><tbody id="resBody"></tbody></table>
    <button id="againBtn" class="big">再来一局</button>
    <button id="menuBtn" class="alt">返回菜单</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="vendor/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wrapAng = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); return lerp(lerp(hash2(xi, yi, s), hash2(xi + 1, yi, s), u), lerp(hash2(xi, yi + 1, s), hash2(xi + 1, yi + 1, s), u), v); }
function fbm(x, y, s) { return vnoise(x, y, s) * 0.6 + vnoise(x * 2.1, y * 2.1, s + 7) * 0.3 + vnoise(x * 4.3, y * 4.3, s + 13) * 0.1; }
const store = {
  get(k, d) { try { const v = localStorage.getItem('bk_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bk_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ================= constants & data ================= */
const B = 3, ROAD = 10, WALL = 17, LAPS = 3, BASE = 42, ACC = 24;
const TRACKS = [
  { name: '青草环线', sub: '湖泊 · 橡树林', seed: 11, hill: 5, water: true, capH: 5, deco: 'oak', fence: 0xe8c34a,
    pts: [[0,-120],[90,-110],[150,-50],[140,30],[80,60],[60,120],[-10,140],[-80,110],[-140,40],[-130,-50],[-70,-100]],
    col: { road: 0x7f838c, curbA: 0xd9453b, curbB: 0xf0f0f0, ground: 0x62b043, shoulder: 0x86c255, side: 0x8a5a33, high: 0x9aa0a6, water: 0x3f86d8, far: 0x4f9a37, sky: 0x8fd0f7, fog: 0xc8e8fb, sun: 0xfff4dd } },
  { name: '赤砂峡谷', sub: '台地 · 仙人掌', seed: 23, hill: 8, water: false, capH: 4, deco: 'cactus', fence: 0x9b6a3a,
    pts: [[0,-150],[100,-140],[160,-80],[110,-20],[170,40],[140,120],[50,110],[0,160],[-90,140],[-150,70],[-100,10],[-160,-60],[-100,-130]],
    col: { road: 0x8a7868, curbA: 0xe0a030, curbB: 0x5a3a28, ground: 0xe0b56a, shoulder: 0xd2a058, side: 0xc0703a, high: 0xa9542c, water: 0x3f86d8, far: 0xd6a55e, sky: 0xf3c08c, fog: 0xf6d6ab, sun: 0xffe0b0 } },
  { name: '雪峰回廊', sub: '冰湖 · 松林', seed: 37, hill: 7, water: true, capH: 3, deco: 'pine', fence: 0x9fd8f2,
    pts: [[0,-130],[80,-140],[140,-90],[150,0],[100,70],[130,130],[40,150],[-40,110],[-110,140],[-150,60],[-120,-20],[-140,-90],[-70,-130]],
    col: { road: 0x6c7886, curbA: 0x2f7fd8, curbB: 0xf5f7fa, ground: 0xeef3f9, shoulder: 0xdce6ef, side: 0x8a939e, high: 0xffffff, water: 0xa6dcf2, far: 0xe3ebf4, sky: 0xa3bddd, fog: 0xdfe8f3, sun: 0xfff2e6 } }
];
const CHARS = [
  { name: '阿砖', color: 0xc8553d, shirt: 0x3a6ea5, head: '#c8553d', spd: 1.0, acc: 0.9, hnd: 0.9, w: 1.25, extra: 'brick' },
  { name: '蜜蜜', color: 0xf2c230, shirt: 0x2b2b2b, head: '#f2c230', spd: 0.93, acc: 1.1, hnd: 1.05, w: 0.85, extra: 'bee' },
  { name: '冰豆', color: 0x6cc6ee, shirt: 0xffffff, head: '#8fd9f5', spd: 0.96, acc: 1.0, hnd: 1.12, w: 0.95, extra: 'ice' },
  { name: '苔苔', color: 0x4f9a3c, shirt: 0x6b4a2b, head: '#5aa846', spd: 1.03, acc: 0.9, hnd: 0.95, w: 1.15, extra: 'moss' },
  { name: '炭炭', color: 0x3a3d46, shirt: 0xe0662b, head: '#3a3d46', spd: 1.06, acc: 0.86, hnd: 0.86, w: 1.3, extra: 'coal' },
  { name: '樱樱', color: 0xee7fb0, shirt: 0xfff0f6, head: '#f59cc2', spd: 0.95, acc: 1.06, hnd: 1.02, w: 0.9, extra: 'petal' }
];
const DIFFS = [
  { name: '休闲', scale: 0.85, ai: 0.88 },
  { name: '标准', scale: 1.0, ai: 0.96 },
  { name: '极速', scale: 1.15, ai: 1.02 }
];
const QUALS = ['auto', 'low', 'mid', 'high'];
const QNAMES = { auto: '自动', low: '流畅', mid: '均衡', high: '精美' };
const ITEM_NAMES = { turbo: '火箭', jelly: '果冻块', missile: '追踪弹' };

/* ================= device & quality ================= */
const coarse = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
function autoQuality() {
  if (!coarse) return 'high';
  const m = Math.min(screen.width, screen.height);
  return m >= 700 ? 'mid' : 'low';
}
const G = {
  state: 'menu', paused: false, trackIdx: store.get('track', 0), charIdx: store.get('char', 0), diff: store.get('diff', 1),
  qualSel: store.get('qual', 'auto'), qual: 'high', karts: [], player: null, tr: null, raceTime: 0, countdown: 0,
  touch: coarse, time: 0, finishT: 0, shake: 0, frameAvg: 16, slowT: 0
};
if (G.trackIdx >= TRACKS.length) G.trackIdx = 0;
if (G.charIdx >= CHARS.length) G.charIdx = 0;
G.qual = G.qualSel === 'auto' ? autoQuality() : G.qualSel;
const QCFG = {
  low: { dpr: 1, shadow: 0, trees: 0.45, fog: [70, 230], aa: false },
  mid: { dpr: 1.5, shadow: 1024, trees: 0.75, fog: [90, 320], aa: true },
  high: { dpr: 2, shadow: 2048, trees: 1, fog: [110, 420], aa: true }
};

/* ================= renderer ================= */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: QCFG[G.qual].aa, powerPreference: 'high-performance' });
stage.appendChild(renderer.domElement);
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.5, 700);
const hemi = new THREE.HemisphereLight(0xffffff, 0x556070, 0.62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.95);
sun.shadow.camera.left = -48; sun.shadow.camera.right = 48; sun.shadow.camera.top = 48; sun.shadow.camera.bottom = -48;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 220; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.4;
scene.add(sun); scene.add(sun.target);

function applyQuality() {
  const q = QCFG[G.qual];
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q.dpr));
  const wantShadow = q.shadow > 0;
  renderer.shadowMap.enabled = wantShadow;
  sun.castShadow = wantShadow;
  if (wantShadow && sun.shadow.mapSize.x !== q.shadow) {
    sun.shadow.mapSize.set(q.shadow, q.shadow);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  if (scene.fog) { scene.fog.near = q.fog[0]; scene.fog.far = q.fog[1]; }
  scene.traverse(o => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.needsUpdate = true); } });
  resize();
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  G.baseFov = w < h ? 82 : 68;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ================= textures ================= */

/* ================= main loop ================= */
let last = performance.now(); G.frameCount = 0;
function frame(now) {

  let dt = Math.min(0.05, (now - last) / 1000); last = now; G.time += dt; G.frameCount++;
  if (document.hidden) return;
  G.frameAvg = lerp(G.frameAvg, dt * 1000, 0.05);
  if (G.state === 'menu') {
    menuCamera(G.time);
    for (const k of G.karts) { k.body.rotation.y = 0; k.g.visible = true; }
    animateWorld(dt);
    updateParticles(dt);
    renderer.render(scene, camera); return;
  }
  if (!G.paused && G.state !== 'results') {
    const tdt = dt * (G.ts || 1), steps = Math.max(1, Math.ceil(tdt / 0.022)), h = tdt / steps;
    for (let s = 0; s < steps; s++) step(h);
    if (flashTimer > 0) { flashTimer -= dt; if (flashTimer <= 0) $('#center').textContent = ''; }

    if (G.qualSel === 'auto' && G.state === 'race') {

      if (G.slowT > 3 && G.qual !== 'low') { G.qual = G.qual === 'high' ? 'mid' : 'low'; G.slowT = 0; applyQuality(); toast('已自动降低画质以保持流畅', 2200); }
    }

  updateParticles(G.paused ? 0 : dt);

  renderer.render(scene, camera);
}

function step(dt) {

    engineSound(true, inp.thr ? 20 : 0, false);

      if (G.thrPress !== null) { if (G.thrPress <= 1.05 && G.thrPress > 0) { p.boostT = 1.1; sfx('boost'); } else if (G.thrPress > 2.2) { p.spinT = 0.7; p.spinA = 0; } }
